# uitjes — nginx site config.
#
# The point of this file is cache correctness. Without an explicit Cache-Control
# the origin sends none, and Cloudflare then applies its default Browser Cache
# TTL (4 hours) to anything with a .css/.js extension. That pins a stale app.js
# in visitors' browsers for hours after a deploy — the page keeps working, so
# nothing looks broken, it just silently runs the old code.
#
# The site is a few files plus generated data. Revalidating every request
# costs a 304 and removes the entire class of problem.

# Which page of the agenda a request is for; see the location that uses it
# below. A map rather than an `if` in that location: a true `if` runs the
# request in a nested context that does not inherit try_files, so "/" fell
# through to the index module, became /index.html and was 301ed back to "/" --
# a redirect loop, on the first deploy. $request_uri is the URI as sent, which
# try_files does not rewrite. conf.d is included at http level, where map lives.
map $request_uri $uitjes_page {
    ~^/(?:en/)?amsterdam(?:\?|$)  amsterdam;
    ~^/(?:en/)?utrecht(?:\?|$)    utrecht;
    default                       all;
}

# Which language (since 2026-10-21): every page is also in English under /en,
# /en/amsterdam and /en/utrecht. Same file, same events; index.html picks its
# strings with SSI on $uitjes_lang and includes data/pages/en/ for the events.
map $request_uri $uitjes_lang {
    ~^/en(?:/|\?|$)  en;
    default          nl;
}

# The language switch (app.js) stores the reader's choice in a cookie, and a
# page in the other language sends them to their own: a Dutch link opened by
# someone who picked English lands on its /en twin, query string kept. Only an
# explicit choice redirects, never Accept-Language: crawlers send none and
# must see both versions, and a guess from the browser would hide the Dutch
# page from people who simply never set their browser's language.
map $uri $uitjes_en_twin {
    /        /en;
    default  /en$uri;
}
map $uri $uitjes_nl_twin {
    ~^/en(?<rest>/.+)$  $rest;
    default             /;
}

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Never serve dotfiles or tools/backups (.well-known is let through). Same
    # rule as ../nginx-static.conf, see the comment there.
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(bak|py)$      { return 404; }

    # "no-cache" does not mean "do not store" — it means store it, but always
    # revalidate before reuse. ETag/Last-Modified then make that a cheap 304.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The page, with the agenda in it (since 2026-10-19). index.html is
    # hand-written; uitjes-updater writes the next few weeks of events as
    # static HTML into data/pages/, and SSI includes the one for this path, so
    # the events are in the HTML for anything that does not run app.js.
    # /amsterdam and /utrecht are the same page filtered to one city, with
    # their own title and heading (the SSI if/else in index.html). A new city
    # page needs these regexes, CITY_PAGES in uitradar/pages.py and
    # CITY_PAGES in app.js.
    #
    # try_files serves index.html inside THIS location (a matching non-last
    # argument is not an internal redirect), so ssi applies; $uitjes_page and
    # $uitjes_lang are the maps at the top of this file.
    # SSI output carries no ETag/Last-Modified, so each load is a full 200;
    # gzip takes the ~450 KB page to ~55 KB.
    #
    # The `if` is the safe kind (it only returns), unlike the one the map
    # above replaced. 302: the choice can change, and a 301 would be cached.
    location ~ ^/(?:amsterdam|utrecht)?$ {
        absolute_redirect off;
        if ($cookie_uitjes_lang = en) { return 302 $uitjes_en_twin$is_args$args; }
        ssi on;
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_comp_level 5;
        gzip_vary on;
        try_files /index.html =404;
    }
    location ~ ^/en(?:/amsterdam|/utrecht)?$ {
        absolute_redirect off;
        if ($cookie_uitjes_lang = nl) { return 302 $uitjes_nl_twin$is_args$args; }
        ssi on;
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_comp_level 5;
        gzip_vary on;
        try_files /index.html =404;
    }
    # Served raw, index.html would be the page without events and with every
    # branch of its SSI if/else visible; it is not a URL of its own.
    # Relative: nginx would spell the absolute form http://, being behind the
    # proxy that terminates TLS.
    location = /index.html { absolute_redirect off; return 301 /; }
    # /amsterdam/ is the same page under a second URL; send it to the one
    # without the slash, query string kept. Relative for the same reason.
    location ~ ^/(amsterdam|utrecht|en|en/amsterdam|en/utrecht)/$ {
        absolute_redirect off; return 301 /$1$is_args$args;
    }

    # Mail alerts: sign-up, confirm, manage and unsubscribe, one static page
    # driven by meldingen.js. Its API (/api/alerts/) never reaches this nginx:
    # Traefik routes that path to the uitjes-alerts container by itself.
    #
    # In English at /en/alerts (since 2026-10-21): the same file with SSI on,
    # as the agenda, $uitjes_lang picking the language. The language cookie
    # sends each to the other like the agenda's pages; a mail's #beheer=...
    # survives the 302, since browsers carry the fragment over.
    location = /meldingen {
        absolute_redirect off;
        if ($cookie_uitjes_lang = en) { return 302 /en/alerts$is_args$args; }
        ssi on;
        add_header Cache-Control "no-cache";
        try_files /meldingen.html =404;
    }
    location = /en/alerts {
        absolute_redirect off;
        if ($cookie_uitjes_lang = nl) { return 302 /meldingen$is_args$args; }
        ssi on;
        add_header Cache-Control "no-cache";
        try_files /meldingen.html =404;
    }
    location = /meldingen.html { absolute_redirect off; return 301 /meldingen$is_args$args; }
    location = /en/alerts/ { absolute_redirect off; return 301 /en/alerts$is_args$args; }

    # The fragments are only for the include above, never a page of their
    # own: a bare list of events at its own URL would be indexed as a
    # duplicate. `internal` still lets SSI subrequests through.
    location ^~ /data/pages/ { internal; }

    # Written by uitjes-updater next to events.json, with each page's
    # <lastmod>. data/ is mounted over the repo copy, hence the alias.
    location = /sitemap.xml {
        alias /usr/share/nginx/html/data/sitemap.xml;
        add_header Cache-Control "no-cache";
    }

    # Regenerated three times a day by uitjes-updater; must never be reused
    # without checking. Same rule, stated separately so it survives edits above.
    #
    # It is also ~1 MB, and stock nginx only gzips text/html, so it went out raw.
    # Cloudflare brotlis it for visitors coming through the edge, but a client
    # that reaches the origin directly got the full megabyte several times a day.
    # gzip -5 lands within 2% of Cloudflare's brotli for ~13 ms of CPU.
    location = /data/events.json {
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/json;
        gzip_comp_level 5;
        # Without Vary a shared cache can hand this gzipped body to a client that
        # never asked for one. Note nginx weakens the ETag to W/"..." when it
        # compresses on the fly; If-None-Match and the 304s above still work.
        gzip_vary on;
    }
}
