# UITradar source registry.
#
# Everything about where events come from lives in this file. Adding, removing,
# reweighting or re-pointing a source is an edit here — no Python involved,
# as long as an existing adapter fits the shape of the site.
#
#   python3 build.py --list          see the registry
#   python3 build.py --probe <id>    see exactly what one source returns
#
# Adapters: tribe | jsonld | json_api | ticketmaster | ics | rss |
#           regex_cards | manual | carre | ziggodome | boomchicago | paradiso |
#           rss_json

[http]
cache_ttl_seconds = 3600   # re-fetch at most hourly while you iterate
timeout_seconds = 25
delay_seconds = 0.4        # polite gap between live requests
# One timed-out fetch used to cost a whole source: the build degrades rather
# than fails, so a transient Melkweg timeout published a site missing 227
# events. Retries cover that. They apply only to timeouts, dropped connections
# and 5xx/429 — a 404 is an answer, not a hiccup.
retries = 2
retry_backoff_seconds = 1.0
# The brake on retrying. After this many consecutive failures against one host,
# every further request to it fails immediately for the rest of the run, so a
# host that is genuinely down costs seconds rather than an hour of a 200-request
# source waiting out its timeout. Any success resets the count.
host_failure_limit = 4

# Sanity check between building the dataset and replacing the published one.
# A source that breaks does not fail the build - one bad source is meant to
# degrade the agenda, not kill it - so without this a single timeout silently
# publishes a thinner site. Tripping it costs nothing: the previous
# events.json keeps serving and the next run tries again a few hours later.
# `build.py --force` publishes anyway, which is what to use after deliberately
# removing a source.
[publish]
# Sources smaller than this are not worth blocking a publish over: the ArenA
# announcing five home games instead of twelve is a quiet month, not a bug.
min_events_to_guard = 20
# Refuse if a source that cleared that floor last build now has less than half
# of what it had. Catches both a source that errored and one that silently
# stopped matching after a site redesign.
source_drop_fraction = 0.5
# Backstop for many sources degrading a little at once rather than one failing
# outright: refuse if the whole agenda shrinks by more than a fifth.
total_drop_fraction = 0.2

[filter]
horizon_days = 120
# Drop anything we can't place in one of the cities below. Set false to keep
# everything the sources hand us (useful while debugging a new source).
require_known_city = true
drop_title_contains = ["cadeaubon", "gift card", "parkeer", "combiticket"]
# Second dedupe pass. The primary key is title+day+city, which misses one event
# wearing two labels — "Douwe Bob" from the venue and "Douwe Bob in Paradiso"
# from an aggregator. This merges a title that contains another title, within
# the same day and city. What stops it eating genuine satellite events (an
# afterparty, a Vriendenrepetitie) is the `aggregator` flag on the sources
# below, not a list of words — see _may_merge in pipeline.py. Every merge is
# printed by the build and recorded under "merges" in events.json.
fuzzy_titles = true
# Aggregator boilerplate that would otherwise show up as an event description.
drop_summary_contains = [
  "automatisch samengesteld",
  "controleer datum, tijd en details",
]

# Canonical city -> the strings (in venue or city fields) that fold onto it.
# This is how "and around" is defined: widen these lists to widen the net.
[filter.cities]
Amsterdam = [
  "amsterdam", "ijburg", "amstelveen", "duivendrecht", "diemen",
  "zaandam", "haarlem", "ziggo dome", "afas live", "johan cruijff",
  "paradiso", "melkweg", "concertgebouw", "carré", "carre", "muziekgebouw",
  "de la mar", "internationaal theater", "bimhuis", "royal theater tuschinski",
  "kleine komedie", "boom chicago",
  # Rooms Paradiso programmes but does not own — see the paradiso source.
  "tolhuistuin", "bitterzoet", "zonnehuis", "cinetol", "skatecafe",
]
Utrecht = [
  "utrecht", "leidsche rijn", "nieuwegein", "zeist", "de bilt", "houten",
  "maarssen", "bunnik", "vleuten", "amersfoort",
  "tivolivredenburg", "tivoli", "stadsschouwburg utrecht", "ekko",
  "de helling", "db's", "theater kikker", "domtoren", "pieterskerk",
]

[output]
# When two sources describe the same event, the one listed first wins and the
# others only donate fields it is missing. Reorder to change who is canonical.
# Venue-direct sources first: they are the primary record for their own
# programme. The city-wide agendas are broader but second-hand — uitamsterdam
# in particular auto-generates its entries from public sources and says so.
source_priority = [
  "concertgebouw",
  "tivolivredenburg",
  "carre",
  "paradiso",
  "kleine_komedie",
  "boomchicago",
  "stadsschouwburg_utrecht",
  "melkweg",
  "ziggodome",
  "afaslive",
  "johancruijffarena",
  "ticketmaster_nl",
  "uitamsterdam",
  "uitagenda_utrecht",
  "markets_manual",
  "theaterkrant",
]

# Applied to every source unless it overrides them.
[defaults]
horizon_days = 120


# ---------------------------------------------------------------------------
# VERIFIED WORKING — open REST API, no key, ~240 events for Amsterdam
# ---------------------------------------------------------------------------
[[source]]
id = "uitamsterdam"
label = "Uit Amsterdam"
adapter = "tribe"
enabled = true
base_url = "https://www.uitamsterdam.com"
# Second-hand: it republishes other organisations' programmes, and its own
# titles are auto-generated, so it can list one event twice under two names.
