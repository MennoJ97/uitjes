# ---------------------------------------------------------------------------
# TICKETMASTER — disabled, and no longer needed for the reason it was added.
# It was the only route to Ziggo Dome and AFAS Live; both are now read straight
# from the venues (see below), which is a better record anyway. What it would
# still add is Johan Cruijff ArenA and AFAS Theater, plus a long tail of smaller
